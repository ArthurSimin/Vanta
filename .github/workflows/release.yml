name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  # Packages are built on the oldest supported Ubuntu so the binary links
  # against the oldest glibc and Qt 6 the project supports. That is what makes
  # one set of packages installable on Ubuntu 22.04+, Debian 12+, Fedora,
  # openSUSE and Arch instead of only on the build host's release.
  linux:
    name: Build and publish
    runs-on: ubuntu-22.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libarchive-tools \
            zlib1g-dev \
            zstd \
            dpkg-dev \
            rpm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.2.4'
          cache: true

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          # A fixed timestamp keeps the packages byte-identical between runs.
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log

      - name: Fail on warnings
        run: |
          if grep -nE '(^|[[:space:]])(warning|error):' build.log; then
            echo "::error::Release build produced warnings or errors"
            exit 1
          fi

      - name: Verify ABI floor
        run: |
          # The whole point of building here is a low ABI requirement. If a
          # newer symbol slips in, the packages silently stop working on older
          # distributions, so the release fails instead.
          binary=build/vanta
          qt_max="$(objdump -T "$binary" | grep -oE 'Qt_6\.[0-9]+' | sort -uV | tail -1)"
          glibc_max="$(objdump -T "$binary" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)"
          glibcxx_max="$(objdump -T "$binary" | grep -oE 'GLIBCXX_[0-9.]+' | sort -uV | tail -1)"
          cxxabi_max="$(objdump -T "$binary" | grep -oE 'CXXABI_[0-9.]+' | sort -uV | tail -1)"
          echo "requires ${qt_max}, ${glibc_max}, ${glibcxx_max}, ${cxxabi_max}"

          fail() { echo "::error::$1"; exit 1; }

          [[ "$qt_max" == "Qt_6.2" ]] || fail "Expected a Qt 6.2 ABI, got $qt_max"

          # Ubuntu 22.04 ships glibc 2.35, libstdc++ with GLIBCXX_3.4.30 and
          # CXXABI_1.3.13. Anything above that would not install there.
          at_most() {
              [[ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" == "$1" ]]
          }
          at_most GLIBC_2.35   "$glibc_max" || fail "Binary needs $glibc_max, newer than the Ubuntu 22.04 baseline (GLIBC_2.35)"
          at_most GLIBCXX_3.4.30 "$glibcxx_max" || fail "Binary needs $glibcxx_max, newer than the Ubuntu 22.04 baseline (GLIBCXX_3.4.30)"
          at_most CXXABI_1.3.13  "$cxxabi_max" || fail "Binary needs $cxxabi_max, newer than the Ubuntu 22.04 baseline (CXXABI_1.3.13)"

      - name: Stage install tree
        run: |
          rm -rf stage
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          find stage -type f | sort

      - name: Build packages
        run: |
          SOURCE_DATE_EPOCH="${{ steps.version.outputs.epoch }}" \
          ./packaging/build-packages.sh \
            --root stage \
            --version "${{ steps.version.outputs.version }}" \
            --out dist

      - name: Verify packages
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          deb="dist/vanta_${version}_amd64.deb"
          rpmpkg="dist/vanta-${version}-1.x86_64.rpm"
          pac="dist/vanta-${version}-1-x86_64.pkg.tar.zst"

          echo "--- deb metadata"
          dpkg-deb --info "$deb" | sed -n '1,12p'
          dpkg-deb --contents "$deb" | grep -E 'bin/vanta|\.desktop|vanta\.svg'

          echo "--- rpm metadata"
          rpm -qip "$rpmpkg" | sed -n '1,12p'
          rpm -qlp "$rpmpkg"

          echo "--- pacman metadata"
          bsdtar -xOf "$pac" .PKGINFO | sed -n '1,14p'

          # The desktop entry and the icon must be inside every package, or the
          # launcher shows up without a name or icon in the application menu.
          for p in "$deb" "$rpmpkg" "$pac"; do
            case "$p" in
              *.deb) dpkg-deb --contents "$p" > listing.txt ;;
              *.rpm) rpm -qlp "$p" > listing.txt ;;
              *)     bsdtar -tf "$p" > listing.txt ;;
            esac
            grep -q 'usr/bin/vanta' listing.txt
            grep -q 'vanta.desktop' listing.txt
            grep -q 'vanta.svg' listing.txt
            echo "ok: $(basename "$p")"
          done
          rm -f listing.txt

      - name: Checksums
        run: |
          cd dist
          sha256sum *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Stage portable tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          stage="vanta-${version}-linux-x86_64"
          rm -rf "$stage"
          # Same layout as the packages, rooted at the tarball instead of /usr,
          # so unpacking it and copying the tree into /usr/local just works.
          # mkdir first: `cp -a usr newdir` would rename usr instead of nesting it.
          mkdir -p "$stage"
          cp -a stage/usr "$stage/usr"
          tar -czf "dist/${stage}.tar.gz" "$stage"
          ( cd dist && sha256sum "${stage}.tar.gz" >> SHA256SUMS )

      - name: Write release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          qt="6.2"
          {
            printf 'Vanta %s — a Linux game launcher for the games you already own.\n\n' "$version"
            printf '### Packages\n\n'
            printf '| Distribution | Package |\n'
            printf '| --- | --- |\n'
            printf '| Debian 12+, Ubuntu 22.04+ | `vanta_%s_amd64.deb` |\n' "$version"
            printf '| Fedora, openSUSE, RHEL | `vanta-%s-1.x86_64.rpm` |\n' "$version"
            printf '| Arch, Manjaro, CachyOS | `vanta-%s-1-x86_64.pkg.tar.zst` |\n' "$version"
            printf '| Any distribution | `vanta-%s-linux-x86_64.tar.gz` |\n\n' "$version"
            printf '```bash\n'
            printf '# Debian / Ubuntu\n'
            printf 'sudo apt install ./vanta_%s_amd64.deb\n\n' "$version"
            printf '# Fedora / openSUSE\n'
            printf 'sudo dnf install ./vanta-%s-1.x86_64.rpm\n\n' "$version"
            printf '# Arch\n'
            printf 'sudo pacman -U vanta-%s-1-x86_64.pkg.tar.zst\n' "$version"
            printf '```\n\n'
            printf 'Built against Qt %s and glibc 2.35, so the packages run on any\n' "$qt"
            printf 'distribution that ships Qt 6.2 or newer. Packages are unsigned; check\n'
            printf '`SHA256SUMS` before installing.\n\n'
            printf 'Vanta never downloads games. OnlineFix detection reports what it finds\n'
            printf 'and never claims a fix works; see ONLINEFIX.md.\n\n'
            printf '### Mods\n\n'
            printf 'Games with BepInEx can now be managed from the launcher. Open **Mods…**\n'
            printf 'from the game context menu or **Game details** to enable or disable a\n'
            printf 'plugin, import a local `.dll` or `.zip`, or browse the game community on\n'
            printf 'Thunderstore and install a package with its dependencies. Toggling only\n'
            printf 'renames a file between `.dll` and `.dll.disabled`; replaced files are\n'
            printf 'backed up under `BepInEx/.vanta-backups/` first.\n\n'
            printf '### Launch logs\n\n'
            printf 'Every launch now keeps its log. Choose **Logs…** from the main menu, the\n'
            printf 'game context menu, the details sheet or the prompt shown after a game\n'
            printf 'exits unexpectedly, and the terminal-styled viewer opens the newest\n'
            printf 'launch scrolled to the last line. The log holds the composed command,\n'
            printf 'the working directory, environment overrides and everything the runner\n'
            printf 'printed, so a game that closed on its own can still be diagnosed.\n\n'
            printf 'Wine output is no longer silenced: Settings → Runners → **Wine log\n'
            printf 'detail** defaults to `Errors only`, which keeps real failures and drops\n'
            printf 'the fixme chatter. Logs are stored under `$XDG_DATA_HOME/vanta/logs/`,\n'
            printf 'the newest 20 launches per game; **Clear logs** removes only those\n'
            printf 'files and never touches the game folder.\n\n'
            printf '### Update notification\n\n'
            printf 'Vanta checks GitHub once per start for a newer release and shows a\n'
            printf 'banner with **Open release page** when one exists. **Check for updates…**\n'
            printf 'in the main menu runs the same check on demand. The check reads only the\n'
            printf 'latest release metadata: nothing is downloaded or installed, because the\n'
            printf 'package belongs to your distribution. A failed check is a status line,\n'
            printf 'not a dialog, and it only appears when you asked for it.\n\n'
            printf '### OnlineFix indicator\n\n'
            printf 'Setting a game to **OnlineFix → Disabled** now hides the OnlineFix badge\n'
            printf 'from its cover, the list view and the detail strip, because a marker the\n'
            printf 'launch path ignores promises something that will not happen. The detail\n'
            printf 'sheet still reports what was detected and states that the configuration\n'
            printf 'is not applied.\n\n'
            printf '### Fixes\n\n'
            printf '%s\n' '- Signature detection no longer matches ordinary runtime libraries such'
            printf '  as `wininet.dll`, `steam_api64.dll` or `EOSSDK-Win64-Shipping.dll`,\n'
            printf '  which reported a fix and prompted for it on many Steam and Epic titles.\n'
            printf '%s\n' '- Quitting Vanta with a game running now stops the Wine prefix through'
            printf '  `wineserver` and keeps the playtime and launch log of that session.\n'
            printf '%s\n' '- A native game behind a launcher script is stopped as a process group, so'
            printf '  its real process no longer survives the quit, and the launch log records\n'
            printf '  the stopped session instead of claiming the process never started.\n'
            printf '%s\n' '- A Wine build folder is accepted as a runner path; the wine binary and'
            printf '  its `wineserver` are resolved inside it.\n'
            printf '%s\n' '- A custom runner reports a missing game executable instead of launching'
            printf '  with no game argument.\n'
            printf '%s\n' '- Void systems remove Wine with `xbps-remove`, and the uninstall button'
            printf '  explains itself when that command is absent.\n'
            printf '%s\n' '- Ported games that the library could not save are reported instead of'
            printf '  silently disappearing at the next start.\n'
            printf '%s\n' '- Legacy CP1252 OnlineFix INIs keep their encoding, byte for byte, and'
            printf '  the UTF-8 BOM survives an edit.\n'
            printf '%s\n' '- Downloaded cover images are written atomically, so an interrupted'
            printf '  download cannot leave a truncated image that the grid paints as a\n'
            printf '  broken card.\n'
            printf '%s\n' '- The executable list is capped at 400 entries; the cap now shows a'
            printf '  warning instead of silently hiding a game binary beyond it.\n\n'
            printf '### Verify\n\n'
            printf '```bash\n'
            printf 'sha256sum -c SHA256SUMS --ignore-missing\n'
            printf '```\n\n'
            printf 'Packages are unsigned. Every binary in them needs only Qt 6.2 and glibc 2.35,\n'
            printf 'so one package runs across a whole distribution family rather than a single\n'
            printf 'release.\n\n'
            printf '**Full Changelog**: %s/commits/%s\n' \
                "${{ github.server_url }}/${{ github.repository }}" \
                "${{ steps.version.outputs.tag }}"
          } > notes.md
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vanta ${{ steps.version.outputs.version }}
          draft: false
          # The body is generated here rather than by the action, so re-running
          # a release replaces the notes instead of appending a second copy.
          body_path: notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/SHA256SUMS
